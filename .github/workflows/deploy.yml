name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Todos los días: actualiza videos, listas y publicaciones desde YouTube/Steam/Paradox.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Base del sitio
        # Con dominio propio (archivo public/CNAME) la base es "/"; sin dominio, "/<repo>/".
        run: |
          if [ -f public/CNAME ]; then echo "VITE_BASE=/" >> "$GITHUB_ENV"; else echo "VITE_BASE=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"; fi
      - run: npm run build
      - name: Fallback SPA (rutas como /videos)
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
